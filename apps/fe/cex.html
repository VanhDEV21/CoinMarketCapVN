<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CryptoMarketCap</title>
  <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="dex.css" />
  <link rel="stylesheet" href="cex.css" />
  <link rel="stylesheet" href="topbar.css" />
</head>
<body>
  <div id="topbar-root"></div>
  <div class="page">
    <header class="header">
      <div class="title">
        <span class="dot"></span>
        <h1>CEX Explorer</h1>
      </div>
      <div class="toolbar">
        <div class="search">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79L20 21.5 21.5 20 15.5 14Zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14Z"/>
          </svg>
          <input id="q" placeholder="Search exchange / id / country..." autocomplete="off" />
        </div>
        <label class="label">Min trust</label>
        <select id="minTrust" class="select">
          <option value="8" selected>≥ 8</option>
          <option value="9">≥ 9</option>
          <option value="10">= 10</option>
        </select>
      </div>
    </header>

    <main class="content">
      <section class="card">
        <div class="card-head">
          <h2>Exchanges</h2>
          <small class="muted">Data from backend · click headers to sort</small>
        </div>

        <div class="table-wrap">
          <table class="table" id="cexTable">
            <thead>
              <tr>
                <th data-sort="rank" style="width:70px">#</th>
                <th data-sort="name">Exchange</th>
                <th data-sort="trust" style="width:140px">Trust</th>
                <th class="right" data-sort="vol" style="width:220px">Vol 24h (BTC)</th>
                <th class="right" style="width:120px">Action</th>
              </tr>
            </thead>
            <tbody id="cexBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" role="alert"></div>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="cex.js"></script>
    <script src="topbar.js"></script>
  <script>
    Topbar.mount('#topbar-root', {
      brand: { text: 'CRYPTOMARKETCAP', href: 'index.html' },
      items: [
        { text: 'Home', href: 'index.html' },
        { text: 'CEX',  href: 'cex.html' },
        { text: 'DEX',  href: 'dex.html' }
      ],
      auth: { loginHref: 'login.html' },
      bot:  { href: 'https://t.me/CRYPTOANNOUCEBOT' }
    });
  </script>
</body>
</html>
