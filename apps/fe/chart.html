<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CryptoMarketCap</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0f1620;
      --card: #101823;
      --grid: #1f2a38;
      --text: #c9d4e5;
      --muted: #7e8ca3;
      --border: #1a2431;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .page-header { max-width: 1600px; margin: 28px auto 0; padding: 0 24px; }
    h1.brand { margin: 0; color: #fff; font-size: 42px; line-height: 1.2; }
    h1.brand a, h1.brand a:visited, h1.brand a:hover, h1.brand a:active, h1.brand a:focus {
      color: #fff !important; text-decoration: none !important;
    }
    h1.brand a:focus-visible { outline: 2px solid #4aa8ff; outline-offset: 2px; }

    /* Layout: info left + chart right */
    .main-container {
      display: flex; flex-direction: row; align-items: flex-start;
      gap: 24px; max-width: 1600px; margin: 40px auto; padding: 0 24px;
      transform: translateX(-120px);
    }
    .coin-info {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 18px 22px;
      width: 408px; min-width: 380px; box-shadow: 0 4px 20px rgba(0,0,0,.15);
      flex-shrink: 0;
    }
    .coin-info h2 { margin: 0 0 12px; font-size: 18px; font-weight: 600; color: #fff; }
    .coin-detail { display: flex; justify-content: space-between; padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,.06); font-size: 14px; }
    .coin-detail strong { color: var(--muted); }
    .meta { color: var(--muted); font-size: 13px; margin-bottom: 10px; }

    .chart-panel {
      flex: 0 0 72%;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 20px; min-height: 60vh;
      display: flex; flex-direction: column; position: relative;
    }
    .chart-type-switch { display: flex; gap: 8px; margin-bottom: 12px; }
    .chart-type-switch button {
      background: #252b38; border: none; color: #c9d4e5;
      padding: 6px 10px; border-radius: 8px; cursor: pointer; transition: background .2s;
    }
    .chart-type-switch button.active { background: #38455a; color: #fff; }
    .chart-type-switch button:hover { background: #303b4c; }
    #chartWrap { flex: 1; height: 100%; min-height: 432px; }

    @media (max-width: 900px) {
      .main-container { flex-direction: column; align-items: center; }
      .coin-info, .chart-panel { width: 95%; }
    }
  </style>
  <link rel="stylesheet" href="./modern-dark.css" />
  <link rel="stylesheet" href="topbar.css" />
</head>
<body>
  <div id="topbar-root"></div>
  <!-- Timeframe selector -->
  <div class="tf-bar" style="display:flex;gap:8px;align-items:center;margin-bottom:8px;">
    <label for="tf">Timeframe:</label>
    <select id="tf" style="padding:6px 10px;">
      <option value="5m">5m</option>
      <option value="10m">10m</option>
      <option value="15m">15m</option> <!-- NEW -->
      <option value="30m">30m</option>
      <option value="1h" selected>1h</option>
    </select>
  </div>
  <div class="main-container">
    <!-- Info left -->
    <div class="coin-info">
      <h2 id="title">Coin Info</h2>
      <div class="meta" id="subtitle">Fetching data...</div>
      <div class="coin-detail"><strong>Price:</strong> <span id="price">$--</span></div>
      <div class="coin-detail"><strong>Market Cap:</strong> <span id="market-cap">$--</span></div>
      <div class="coin-detail"><strong>Volume 24h:</strong> <span id="volume-change-24h">$--</span></div>
      <div class="coin-detail"><strong>Circulating:</strong> <span id="circulating-supply">--</span></div>
      <div class="coin-detail"><strong>Total Supply:</strong> <span id="total-supply">--</span></div>
      <div class="coin-detail"><strong>Max Supply:</strong> <span id="max-supply">--</span></div>
      <div class="coin-detail"><strong>FDV:</strong> <span id="fdv">--</span></div>
    </div>

    <!-- Chart right -->
    <div class="chart-panel">
      <div class="chart-type-switch">
        <button id="btn-line" class="active">📈 Price</button>
        <button id="btn-candle">🕯️ Candle</button>
        <button id="btn-line-market-cap">📈 Market Cap</button>
      </div>
      <div id="chartWrap"><canvas id="coinChart"></canvas></div>
    </div>
  </div>
  <section id="markets" style="margin-top: 24px;">
  <h2 style="margin:0 0 8px;">Markets</h2>
  <div id="markets-loading">Loading markets…</div>
  <div class="table-scroll" style="overflow:auto;border:1px solid #223; border-radius:8px;">
    <table id="markets-table" style="width:100%; border-collapse:collapse; min-width:720px;">
      <thead>
        <tr style="text-align:left;">
          <th style="padding:10px;">#</th>
          <th style="padding:10px;">Exchange</th>
          <th style="padding:10px;">Pair</th>
          <th style="padding:10px;">Price (USD)</th>
          <th style="padding:10px;">Spread</th>
          <th style="padding:10px;">24h Volume (USD)</th>
          <th style="padding:10px;">Updated</th>
          <th style="padding:10px;"></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</section>


  <!-- libs -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>

  <!-- financial chart plugin for Chart.js 4 -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial/dist/chartjs-chart-financial.min.js"></script>

  <!-- zoom/pan plugin -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2"></script>

  <!-- Register controllers/elements/plugins -->
  <script>
    const fin = window['chartjs-chart-financial'] || {};
    const { CandlestickController, CandlestickElement, OhlcController, OhlcElement } = fin;
    const { TimeScale, LinearScale, CategoryScale, Tooltip, Legend } = Chart;
    Chart.register(
      CandlestickController, CandlestickElement,
      OhlcController, OhlcElement,
      TimeScale, LinearScale, CategoryScale, Tooltip, Legend,
      window['chartjs-plugin-zoom']
    );
  </script>

  <!-- logic -->
  <script src="chart.js"></script>
    <script src="topbar.js"></script>
  <script>
    Topbar.mount('#topbar-root', {
      brand: { text: 'CRYPTOMARKETCAP', href: 'index.html' },
      items: [
        { text: 'Home', href: 'index.html' },
        { text: 'CEX',  href: 'cex.html' },
        { text: 'DEX',  href: 'dex.html' }
      ],
      auth: { loginHref: 'login.html' },
      bot:  { href: 'https://t.me/CRYPTOANNOUCEBOT' }
    });
  </script>
</body>
</html>
