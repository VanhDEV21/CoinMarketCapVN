<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Market</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.ico" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="brand">
        <a id="brand-home" href="index.html">CryptoMarketCap</a>
      </h1>
    <div class="auth-actions">
      <button id="btn-overview" onclick="location.href='overview.html'">Market Overview</button>
      <button id="btn-notifications" onclick="toggleNotifications()" title="Turn notifications on/off" style="display:none;">🔔</button>
      <button id="btn-login"  style="display:none;" onclick="location.href='login.html'">Login</button>
      <button id="btn-logout" style="display:none;" onclick="logout()">Logout</button>
    </div>

    </div>
    <div class=" toolbar">
      <input id="search-input" type="text" placeholder="Search by name or symbol..." />
    </div>
    <div id="login-hint">Please <a href="login.html">login</a> to use Watchlist.</div>
    <div class="tabs">
      <button id="tab-all" class="tab active">All</button>
      <button id="tab-watch" class="tab">Watchlist ★</button>
    </div>
    <table id="coin-table">
    <thead>
      <tr>
        <th>#</th>
        <th>Name</th>
        <th>Price</th>
        <th id="th-5m" style="cursor: pointer;">5m %</th>
        <th id="th-1h" style="cursor: pointer;">1h %</th>
        <th id="th-24h" style="cursor: pointer;">24h %</th>
        <th>Volume 24h</th>
        <th>Market Cap</th>
      </tr>
    </thead>
      <tbody id="coin-table-body">
        <!-- Dữ liệu sẽ được chèn vào đây từ API -->
      </tbody>
    </table>
    <div id="pagination" style="text-align:center; margin:20px 0;">
  <!-- Pagination buttons sẽ được render ở đây -->
</div>

  </div>
  <div id="chart-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6);">
  <div style="max-width:900px; margin:5% auto; background:#1e1e1e; padding:16px; border-radius:8px;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2 id="chart-title" style="margin:0;">Coin Chart</h2>
      <button id="chart-close" style="background:#444;border:none;color:#fff;padding:6px 10px;border-radius:6px;cursor:pointer;">Close</button>
    </div>
    <canvas id="coinChart" height="120"></canvas>
  </div>
  </div>
  <!-- Modal liên kết Telegram -->
<div id="tg-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:9999;">
  <div style="max-width:420px; margin:8% auto; background:#1e1e1e; color:#fff; border-radius:14px; padding:20px;">
    <h3 style="margin-top:0">Link Telegram để nhận thông báo</h3>
    <p>Quét mã hoặc bấm nút bên dưới để mở bot, nhắn <b>/start</b> rồi gửi email của bạn.</p>
    <div style="display:flex; justify-content:center; margin:12px 0;">
      <img id="tg-qr" src="assets/cryptoannouce-qr.png" alt="Telegram QR" style="width:240px; height:auto; border-radius:12px;"/>
    </div>
    <div style="display:flex; gap:8px; justify-content:flex-end;">
      <a id="tg-link" href="https://t.me/CRYPTOANNOUCEBOT" target="_blank"
         style="background:#3a7bfd; color:#fff; text-decoration:none; padding:8px 12px; border-radius:8px;">Mở bot</a>
      <button id="tg-close" style="background:#444; color:#fff; border:none; padding:8px 12px; border-radius:8px; cursor:pointer;">Đóng</button>
    </div>
  </div>
</div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
