<!-- apps/fe/dex.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CryptoMarketCap</title>

  <link rel="stylesheet" href="dex.css" />
  <link rel="stylesheet" href="topbar.css" />
</head>
<body>
  <div id="topbar-root"></div>
  <div class="page">
    <header class="header">
      <div class="title">
        <span class="dot"></span>
        <h1>DEX Explorer</h1>
      </div>
      <div class="toolbar">
        <label class="label">Network</label>
        <select id="netSelect" class="select"></select>
        <div class="search">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79L20 21.5 21.5 20 15.5 14Zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14Z"/></svg>
          <input id="dexSearch" placeholder="Search exchange..." autocomplete="off" />
        </div>
        <button id="backBtn" class="btn ghost" style="display:none">← Back</button>
      </div>
    </header>

    <main class="content">
      <!-- DEX LIST -->
      <section id="dexSection" class="card">
        <div class="card-head">
          <h2>Exchanges</h2>
          <small class="muted">Top dexes by network</small>
        </div>
        <div class="table-wrap">
          <table id="dexTable" class="table">
            <thead>
              <tr>
                <th>#</th>
                <th>Exchange</th>
                <th>Network</th>
                <th class="right">Vol 24h</th>
                <th class="right">Liquidity</th>
                <th class="right">Mkt Share</th>
                <th class="right">Action</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <!-- SLIDE PANEL: POOLS -->
      <aside id="drawer" class="drawer">
        <div class="drawer-head">
          <div>
            <h3 id="drawerTitle">Pools</h3>
            <small class="muted">Top pools</small>
          </div>
          <button id="drawerClose" class="btn ghost">✕</button>
        </div>
        <div class="table-wrap drawer-body">
          <table id="poolTable" class="table">
            <thead>
              <tr>
                <th>#</th>
                <th>Pool</th>
                <th>Address</th>
                <th class="right">Vol 24h (USD)</th>
                <th class="right">Reserve (USD)</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </aside>

      <div id="drawerMask" class="drawer-mask"></div>
    </main>
  </div>

  <div id="toast" class="toast" role="alert"></div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="dex.js"></script>
    <script src="topbar.js"></script>
  <script>
    Topbar.mount('#topbar-root', {
      brand: { text: 'CRYPTOMARKETCAP', href: 'index.html' },
      items: [
        { text: 'Home', href: 'index.html' },
        { text: 'CEX',  href: 'cex.html' },
        { text: 'DEX',  href: 'dex.html' }
      ],
      auth: { loginHref: 'login.html' },
      bot:  { href: 'https://t.me/CRYPTOANNOUCEBOT' }
    });
  </script>
</body>
</html>
