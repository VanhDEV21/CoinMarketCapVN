<!-- apps/fe/dex.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DEX Explorer</title>
  <link rel="stylesheet" href="./modern-dark.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="container">
    <h1>DEX Explorer</h1>

    <div class="toolbar">
      <label for="networkSelect">Network:</label>
      <select id="networkSelect"></select>
    </div>

    <table class="table">
      <thead>
        <tr>
          <th style="width:60px">#</th>
          <th>Exchange</th>
          <th>Network</th>
          <th># Pools / Pairs</th>
          <th>24h Volume (USD)</th>
          <th>% Market Share (24h)</th>
          <th>Link</th>
        </tr>
      </thead>
      <tbody id="dexTbody"></tbody>
    </table>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="dex.js"></script>
</body>
</html>
